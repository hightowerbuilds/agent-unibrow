[workspace]
resolver = "3"
members = [
    "crates/shell",
    "crates/agent-core",
    "crates/router",
    "crates/policy",
    "crates/trace",
    "crates/page-model",
    "crates/evals",
    "crates/rails/rail-api",
    "crates/rails/rail-commerce",
    "crates/rails/rail-aggregator",
    "crates/rails/rail-browser",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Pinned exactly: GPUI is pre-1.0 and its API changes between releases.
gpui = "=0.2.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-channel = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "6"
open = "5"

trace = { path = "crates/trace" }
router = { path = "crates/router" }
policy = { path = "crates/policy" }
agent-core = { path = "crates/agent-core" }
rail-api = { path = "crates/rails/rail-api" }
