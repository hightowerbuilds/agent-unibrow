<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Find parts – Unibrow Parts</title><style>body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; background: #fff; color: #1b2733; } .result { border: 1px solid #d5dce2; border-radius: 8px; padding: 12px; margin: 10px 0; }</style></head>
<body>
  <nav><a href="shop.html">Unibrow Parts</a></nav>
  <main>
    <h1 id="heading">Search results</h1>
    <div id="results"></div>
  </main>
  <script>
    const parts = [
      { name: 'TUSQ XL Jazz Bass nut', url: 'p-tusq.html', price: '13.98' },
      { name: 'Bone Jazz Bass nut', url: 'p-bone.html', price: '9.50' },
      { name: 'Brass Jazz Bass nut', url: 'p-brass.html', price: '24.00' },
    ];
    const q = (new URLSearchParams(location.search).get('q') || '').toLowerCase();
    const words = q.split(/\W+/).filter(w => w.length > 1);
    document.getElementById('heading').textContent = 'Results for “' + q + '”';
    const scored = parts
      .map(p => ({ p, score: words.filter(w => p.name.toLowerCase().includes(w)).length }))
      .filter(x => x.score > 0)
      .sort((a, b) => b.score - a.score);
    document.getElementById('results').innerHTML = scored.length
      ? scored.map(({ p }) => '<div class="result"><h3><a href="' + p.url + '">' + p.name + '</a></h3><p>$' + p.price + '</p></div>').join('')
      : '<p>No parts match.</p>';
  </script>
</body></html>
